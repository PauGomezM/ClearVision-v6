name: Generate audited lockfile fix

on:
  push:
    branches:
      - security/fix-transitive-audit-2026-09

permissions:
  contents: write

jobs:
  fix-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
          cache: npm

      - name: Apply non-breaking audit fixes to lockfile
        run: npm audit fix --package-lock-only --ignore-scripts

      - name: Commit lockfile if changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes required."
            exit 0
          fi
          git commit -m "security: apply non-breaking npm audit fixes [skip ci]"
          git push
